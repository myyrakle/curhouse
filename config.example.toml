# 회사/계정 식별 정보는 파일에 박지 말고 env 로 주입할 것.
# CURHOUSE_AWS_PROFILE / CURHOUSE_AWS_REGION / CURHOUSE_AWS_ACCOUNT_ID /
# CURHOUSE_CUR_BUCKET_NAME 로 아래 값들을 오버라이드 가능.
# 파일 값은 로컬 개발 fallback 정도로만 두고, 배포/공유 환경에선 env 로.

[aws]
profile = ""                           # 실제 값은 CURHOUSE_AWS_PROFILE 로
region = "us-east-1"                   # 실제 값은 CURHOUSE_AWS_REGION 로
account_id = "000000000000"            # 실제 값은 CURHOUSE_AWS_ACCOUNT_ID 로

[cur]
bucket_name = "your-cur-bucket"        # 실제 값은 CURHOUSE_CUR_BUCKET_NAME 로
time_granularity = "HOURLY"
include_resources = true
include_split_cost_allocation = true

# 다중 계정(dev/qa/prod) 지원 — 같은 버킷의 다른 경로에 각 CUR 이 쌓인다.
# name 은 파티션·컬럼 리터럴로 저장되므로 [a-z][a-z0-9_]* 만 허용.
[[sources]]
name = "dev"
prefix = "cur2"
export_name = "cur-export"

# [[sources]]
# name = "qa"
# prefix = "qa"
# export_name = "cur_to_dev"
#
# [[sources]]
# name = "prod"
# prefix = "prod"
# export_name = "cur_to_dev"

[clickhouse]
# host/port/user/password 는 CURHOUSE_CH_HOST/PORT/USER/PASSWORD 로 오버라이드.
host = "localhost"
port = 8123
user = "default"
password = ""
database = "aws_billing"
table = "cur_line_items"
secure = false

[state]
path = ".curhouse-state.json"          # CURHOUSE_STATE_PATH 로 오버라이드 가능
