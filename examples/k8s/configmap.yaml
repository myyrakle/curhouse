apiVersion: v1
kind: ConfigMap
metadata:
  name: curhouse-config
  namespace: curhouse
data:
  # 이 파일이 컨테이너의 /app/config.toml 로 마운트된다.
  # bucket/account/sources 는 실제 값으로 교체.
  config.toml: |
    [aws]
    profile = ""                          # 컨테이너에선 env 로 자격증명 → 비워둠
    region = "us-east-1"
    account_id = "111111111111"

    [cur]
    bucket_name = "your-cur-bucket"
    time_granularity = "HOURLY"
    include_resources = true
    include_split_cost_allocation = true

    [[sources]]
    name = "dev"
    prefix = "cur2"
    export_name = "cur-export"

    # [[sources]]
    # name = "qa"
    # prefix = "qa"
    # export_name = "cur_to_dev"
    #
    # [[sources]]
    # name = "prod"
    # prefix = "prod"
    # export_name = "cur_to_dev"

    [clickhouse]
    host = "clickhouse.example.com"        # env 로도 오버라이드 가능
    port = 443
    user = "api"
    password = ""                          # 반드시 env(secret) 로 주입
    database = "aws_billing"
    table = "cur_line_items"
    secure = true                          # SSL 접속 (env 오버라이드 없음)

    [state]
    path = "/state/state.json"
